# Render Blueprint: the website + the API, on Render's free plan.
# The database lives on Neon (free); paste its connection string when asked.
# Guide: docs/deployment.md → "Free hosting: Render + Neon".
#
# The two URLs below assume Render gives the services exactly these names.
# If Render adds a suffix (e.g. shohjahon-restaurant-api-x1y2.onrender.com), change
# API_INTERNAL_URL, CORS_ORIGINS and PUBLIC_WEB_URL to the real URLs.

services:
  - type: web
    name: shohjahon-restaurant-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_PORT
        value: "4000"
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://shohjahon-restaurant-web-78mj.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://shohjahon-restaurant-web-78mj.onrender.com
      - key: DATABASE_URL
        sync: false # Neon connection string (the direct one, not "pooled")
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Lets the web service tell the API who the visitor is, for per-visitor rate limits.
      - key: INTERNAL_PROXY_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SEED_IF_EMPTY
        value: "true"
      # The first manager sign-in. Entered in the Render dashboard, never in this
      # public file. Only used when the database is empty (first start).
      - key: SEED_MANAGER_EMAIL
        sync: false
      - key: SEED_MANAGER_PASSWORD
        sync: false
      - key: SEED_DEMO_STAFF
        value: "false"
      # Render's free disk is wiped on every restart, so keep menu photos in Neon.
      - key: IMAGE_STORE
        value: database

  - type: web
    name: shohjahon-restaurant-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      # Baked in at build time (Render passes env vars to the Docker build).
      - key: API_INTERNAL_URL
        value: https://shohjahon-restaurant-api-78mj.onrender.com
      - key: INTERNAL_PROXY_SECRET
        fromService:
          type: web
          name: shohjahon-restaurant-api
          envVarKey: INTERNAL_PROXY_SECRET
